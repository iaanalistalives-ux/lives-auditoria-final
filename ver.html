<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporte de auditoría · LIVES</title>
<style>
:root{
  --petrol:#0E3B36; --petrol-2:#12463F; --emer:#10B981;
  --sage:#0F7A5A; --sage-dark:#0B815E; --slate:#4E6B78;
  --taupe:#B45309; --rose:#DC2626; --tan:#F59E0B;
  --warm:#DCE5E2; --warm-light:#F1F6F4; --stone:#5F726C;
  --card:#fff; --sh:0 1px 3px rgba(14,59,54,.06),0 1px 2px rgba(14,59,54,.04);
  --r:12px;
  /* nombres antiguos, apuntando al estándar vigente */
  --navy:#0E3B36; --azul:#0E3B36; --amber:#F59E0B;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Barlow',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#e9edf2;color:var(--ink)}
.toolbar{position:sticky;top:0;background:var(--navy);color:#fff;padding:12px 18px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;z-index:10}
.toolbar h1{font-size:15px;margin:0;font-weight:700}
.toolbar .acts{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.tbtn{border:none;border-radius:8px;padding:0 16px;height:38px;line-height:1;font-weight:700;cursor:pointer;font-size:13px;min-width:150px;max-width:190px;flex:0 0 auto;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
/* En pantallas angostas (celular/tablet en vertical) los botones se acomodan en varias filas,
   más chicos y repartiendo el ancho — nunca se salen de la pantalla ni hay que arrastrar. */
@media (max-width:700px){
  .toolbar{padding:12px 14px}
  .toolbar .acts{gap:6px}
  .tbtn{min-width:0;max-width:none;flex:1 1 calc(50% - 6px);padding:0 6px;font-size:12px}
}
.tbtn.print{background:var(--tan);color:#3b2600}
.tbtn.medbtn{background:var(--sage);color:#fff}
.tbtn.proc{background:var(--slate);color:#fff}
.tbtn.back{background:#0F7A5A;color:#fff}
.tbtn.share{background:#25D366;color:#fff}
.page{max-width:820px;margin:18px auto;background:#fff;padding:30px 34px;box-shadow:0 2px 12px rgba(0,0,0,.1)}
.head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--navy);padding-bottom:12px;margin-bottom:16px}
.head .brand{font-size:22px;font-weight:800;color:var(--navy);letter-spacing:.5px}
.head .code{font-size:12px;color:#778}
.head .res{text-align:right}
.bigres{font-size:20px;font-weight:800;padding:6px 16px;border-radius:8px;display:inline-block}
.bigres.ap{background:#e3f4f1;color:#1c7a6e}.bigres.re{background:#fde7e9;color:#c32030}.bigres.ov{background:#fcf3df;color:#9a7415}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--navy);border-bottom:1px solid var(--line);padding-bottom:5px;margin:20px 0 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px}
.f .k{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:#889}
.f .v{font-size:14px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
th{background:#f0f3f7;text-align:left;padding:7px 9px;font-size:11px;text-transform:uppercase;color:#556;border-bottom:1px solid var(--line)}
td{padding:7px 9px;border-bottom:1px solid #eef1f4}
.deffotoWrap{display:flex;flex-direction:column;gap:3px}
.deflab{font-size:10px;font-weight:700;color:var(--navy)}
.deffoto{width:54px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;display:block}
.aqlbox{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.aqlbox .b{background:#f6f8fb;border-radius:8px;padding:10px;text-align:center}
.aqlbox .b .k{font-size:10px;text-transform:uppercase;color:#889}
.aqlbox .b .v{font-size:18px;font-weight:800;color:var(--navy)}
.ovbox{background:#fcf3df;border:1px solid #F59E0B;border-radius:8px;padding:10px 12px;margin-top:8px;font-size:13px}
.coment{background:#f6f8fb;border-radius:8px;padding:12px;font-size:14px;white-space:pre-wrap;min-height:20px}
.fotos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px}
.fotos figure{margin:0}
.fotos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:#f3f5f8}
.fotoblock{margin-top:14px}
.fotoblock .lab{font-weight:700;font-size:12px;color:var(--navy);background:#eef2f7;padding:5px 10px;border-radius:6px;display:inline-block;margin-bottom:6px}
/* lightbox */
#lb{display:none;position:fixed;inset:0;background:rgba(15,20,30,.92);z-index:100;align-items:center;justify-content:center;flex-direction:column}
#lb.show{display:flex}
#lb .lbScroll{max-width:96vw;max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pinch-zoom}
#lb img{max-width:96vw;max-height:88vh;object-fit:contain;border-radius:6px;transition:transform .15s;transform-origin:center;cursor:zoom-in;display:block}
#lb img.zoom{max-width:none;max-height:none;cursor:zoom-out}
#lb img[data-deg="90"]:not(.zoom),#lb img[data-deg="270"]:not(.zoom){max-width:88vh;max-height:96vw}
#lb #lbTitle{position:absolute;top:18px;left:50%;transform:translateX(-50%);color:#fff;font-weight:700;font-size:15px;background:rgba(31,56,100,.85);padding:8px 18px;border-radius:8px;max-width:80vw;text-align:center}
#lb .rotbtn{position:absolute;top:16px;left:20px;background:#F59E0B;color:#0E3B36;border:none;border-radius:10px;padding:10px 16px;font-size:14px;cursor:pointer;font-weight:700}
#lb .close{position:absolute;top:16px;right:20px;background:#fff;border:none;border-radius:50%;width:42px;height:42px;font-size:22px;cursor:pointer;font-weight:700}
#lb .hint{color:#cdd; margin-top:12px;font-size:13px}
.estado{padding:40px;text-align:center;color:#889}
.foot{margin-top:24px;border-top:1px solid var(--line);padding-top:10px;font-size:11px;color:#99a;display:flex;justify-content:space-between}
/* ===== Ventana emergente de Hojas de medidas / Medidas de proceso (dentro de la misma pestaña, no abre nada aparte) ===== */
#fotosOverlay{display:none;position:fixed;inset:0;background:#3a3f47;z-index:200;overflow-y:auto;font-family:'Barlow',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#fotosOverlay.show{display:block}
.fobar{position:sticky;top:0;background:#0E3B36;padding:12px 18px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;z-index:5;color:#fff}
.fobar h2{font-size:15px;margin:0;font-weight:700}
.fobar .facts{display:flex;flex-wrap:wrap;gap:8px}
.fobar button{border:none;border-radius:8px;padding:0 16px;height:38px;line-height:1;font-weight:700;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
.fobar .fclose{background:#fff;color:#0E3B36}
.fobar .fprint{background:#F59E0B;color:#0E3B36}
.fotabs{display:none;flex-wrap:wrap;gap:8px;padding:12px 18px 0;background:#2f353d}
.ftab{border:1px solid #55606b;background:transparent;color:#dfe4ea;border-radius:20px;padding:7px 16px;font-size:12.5px;font-weight:700;cursor:pointer}
.ftab.on{background:#F59E0B;color:#0E3B36;border-color:#F59E0B}
.fowrap{padding:18px;display:flex;flex-direction:column;align-items:center;gap:18px;background:#2f353d;min-height:calc(100vh - 60px)}
.fotip{color:#dfe4ea;font-size:13px;text-align:center;max-width:600px;margin:0 auto 6px}
.hoja{margin:0;background:#fff;border-radius:10px;padding:14px;max-width:96vw;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.hoja .lab{color:#0E3B36;font-weight:700;font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hoja .lab .girar{background:#0F7A5A;color:#fff;border:none;border-radius:7px;padding:7px 12px;font-weight:700;cursor:pointer;font-size:12px}
/* La caja YA NO recorta la foto (overflow:auto en vez de hidden) — así, al girar 90°, la foto se ve
   completa y con su propio scroll si no cabe, en vez de quedar cortada por un marco que no se ajusta. */
.hoja .imgbox{display:flex;align-items:center;justify-content:center;overflow:auto;max-height:75vh}
.hoja img{display:block;max-width:100%;height:auto;border-radius:6px;transition:transform .15s;transform-origin:center}
.hoja[data-deg="90"] img,.hoja[data-deg="270"] img{max-width:none;max-height:70vh}
@media print{
  /* Mientras la ventana de fotos está abierta, imprimir SOLO eso — el reporte de datos queda oculto */
  body.viendoFotos .toolbar, body.viendoFotos .page{display:none!important}
  body.viendoFotos #fotosOverlay{position:static;display:block!important;background:#fff;overflow:visible}
  body.viendoFotos .fobar, body.viendoFotos .fotip, body.viendoFotos .girar, body.viendoFotos .fotabs{display:none!important}
  body.viendoFotos .fowrap{padding:0;gap:0;min-height:0}
  body.viendoFotos .hoja .imgbox{max-height:none}
  body.viendoFotos .hoja{break-inside:avoid;page-break-inside:avoid;box-shadow:none;border-radius:0;padding:0;margin:0;
    width:210mm;height:297mm;display:flex;align-items:center;justify-content:center;overflow:hidden}
  body.viendoFotos .hoja + .hoja{break-before:page;page-break-before:always}
  body.viendoFotos .hoja .lab{display:block;font-size:11px;font-weight:700;color:#0E3B36;padding:3mm 0 1mm;text-align:center}
  body.viendoFotos .hoja .imgbox{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  body.viendoFotos .hoja[data-deg="0"] img, body.viendoFotos .hoja[data-deg="180"] img{width:auto;height:auto;max-width:200mm;max-height:287mm;object-fit:contain}
  body.viendoFotos .hoja[data-deg="180"] img{transform:rotate(180deg)}
  body.viendoFotos .hoja[data-deg="90"] img, body.viendoFotos .hoja[data-deg="270"] img{transform-origin:center;width:285mm;height:auto;max-height:200mm;object-fit:contain}
  body.viendoFotos .hoja[data-deg="90"] img{transform:rotate(90deg)}
  body.viendoFotos .hoja[data-deg="270"] img{transform:rotate(270deg)}
}
@media print{
  @page{ size: portrait; margin:10mm; }
  .toolbar{display:none}
  #lb{display:none!important}
  body{background:#fff}
  .page{box-shadow:none;margin:0;max-width:none;padding:0}
  h2{break-after:avoid}
  /* Imprimir SOLO los datos (vertical, limpio). Las fotos se ven/imprimen aparte. */
  .fotoblock, #fotosSec{display:none!important}
  .deffoto{width:40px;height:40px}
  .foot{break-before:avoid}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="toolbar">
  <h1 id="ttl">Reporte de auditoría</h1>
  <div class="acts">
    <button class="tbtn back" onclick="volverAtras()">← Volver a buscar</button>
    <button class="tbtn medbtn" id="btnFotos" onclick="abrirVerFotos()" style="display:none">🖼 Ver fotos</button>
    <button class="tbtn share" id="btnShare" onclick="compartirReporte()">📤 Compartir</button>
    <button class="tbtn print" onclick="window.print()">🖨 Imprimir datos</button>
  </div>
</div>

<div class="page" id="page"><div class="estado" id="estado">Cargando auditoría…</div></div>

<div id="fotosOverlay">
  <div class="fobar">
    <h2 id="fotosOverlayTitulo">Ver fotos</h2>
    <div class="facts">
      <button class="fclose" onclick="cerrarFotosOverlay()">✕ Cerrar</button>
      <button class="fprint" onclick="window.print()">🖨 Imprimir / Guardar PDF</button>
    </div>
  </div>
  <div class="fotabs" id="fotosTabs"></div>
  <div class="fowrap" id="fotosOverlayBody"></div>
</div>

<div id="lb" onclick="cerrarLb(event)">
  <button class="close" onclick="cerrarLb(event,true)">×</button>
  <div id="lbTitle"></div>
  <button class="rotbtn" onclick="girarLb(event)">⟳ Girar</button>
  <div class="lbScroll"><img id="lbImg" src="" alt="foto ampliada"></div>
  <div class="hint">⟳ Girar para enderezar · rueda o pellizca para zoom · doble clic para acercar · toca fuera para cerrar</div>
</div>

<script>
const SHEET_ID='1zM-ajBkOs_PgyzEaXh_gVJ1seXvjRJSVO1ZRql7KnVQ';
const C={id:0,fecha:1,nAud:2,proceso:3,intext:4,servicio:5,cliente:6,grupo:7,estiloL:8,estiloC:9,po:10,color:11,
  destino:12,pedido:13,recibido:14,lote:15,licencia:16,loteAql:17,muestra:18,nivel:19,aceptaMax:20,rechazaMin:21,
  totalDef:22,resAql:23,override:24,ovWho:25,ovWhy:26,resFinal:27,medMuestra:28,medDef:29,medRes:30,auditor:31,
  semana:32,fotoGen:33,loteKey:34,repetido:35,loteCont:36,anio:37,computable:38,reproceso:39,coment:40,totalDer:41,
  fotosMed:42,fotosPro:43};

const qs=new URLSearchParams(location.search), ID=qs.get('id');
let FOTOS_MED=[], FOTOS_PRO=[], ES_COSTURA=false;
let DEFS_DATA=[], DERS_DATA=[], FOTOS_CATEGORIAS=[];

async function gviz(tab){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tab)}`;
  const r=await fetch(url); const t=await r.text();
  const j=JSON.parse(t.substring(t.indexOf('{'),t.lastIndexOf('}')+1));
  return (j.table.rows||[]).map(row=>(row.c||[]).map(c=>c&&c.v!=null?String(c.v):''));
}
function norm(s){return String(s||'').trim().toLowerCase();}
function fechaTxt(v){ if(v==null||v==='')return''; const s=String(v); const m=s.match(/^Date\((\d+),(\d+),(\d+)/); if(m){return m[1]+'-'+('0'+(parseInt(m[2])+1)).slice(-2)+'-'+('0'+m[3]).slice(-2);} return s.substring(0,10);}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

// Convierte un link de Drive en URL de imagen visible
function driveImg(url){
  if(!url) return '';
  const m=String(url).match(/[-\w]{25,}/);   // id de Drive
  return m ? `https://drive.google.com/thumbnail?id=${m[0]}&sz=w1600` : url;
}
function driveImgFull(url){
  if(!url) return '';
  const m=String(url).match(/[-\w]{25,}/);
  return m ? `https://drive.google.com/thumbnail?id=${m[0]}&sz=w3600` : url;
}
function fotosDe(celda){
  if(!celda) return [];
  return String(celda).split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
}

async function cargar(){
  if(!ID){ document.getElementById('estado').textContent='Falta el ID de la auditoría.'; return; }
  let rows, defs, ders;
  try{
    [rows,defs,ders]=await Promise.all([gviz('AUDITORÍAS'),gviz('DEFECTOS'),gviz('DERIVADOS')]);
  }catch(e){ document.getElementById('estado').textContent='No se pudo cargar.'; return; }

  const r=rows.find(x=>String(x[C.id]).trim()===ID.trim());
  if(!r){ document.getElementById('estado').textContent='No se encontró la auditoría '+ID; return; }

  const misDef=defs.filter(d=>String(d[0]).trim()===ID.trim());
  const misDer=ders.filter(d=>String(d[0]).trim()===ID.trim());
  render(r,misDef,misDer);
}

function render(r,defs,ders){
  document.getElementById('ttl').textContent='Reporte · '+r[C.id];
  const resF=r[C.resFinal]||'—', rn=norm(resF);
  let cls=rn.indexOf('override')>=0?'ov':(rn.indexOf('aprob')>=0?'ap':(rn.indexOf('rech')>=0?'re':''));

  const esCostura=/costura/i.test(r[C.proceso]||'');
  const fMed=fotosDe(r[C.fotosMed]), fPro=fotosDe(r[C.fotosPro]);
  ES_COSTURA=esCostura;
  FOTOS_MED=fMed.map(u=>driveImgFull(u));
  FOTOS_PRO=fPro.map(u=>driveImgFull(u));
  DEFS_DATA=defs; DERS_DATA=ders;
  // Mostrar el botón si hay fotos en cualquiera de las 3 categorías (medidas, proceso o defectos/derivados)
  const hayFotosDef = defs.some(d=>d[6]) || ders.some(d=>d[6]);
  const hayFotos = FOTOS_MED.length || (esCostura && FOTOS_PRO.length) || hayFotosDef;
  document.getElementById('btnFotos').style.display = hayFotos ? '' : 'none';

  function fil(k,v){return `<div class="f"><div class="k">${k}</div><div class="v">${esc(v)||'—'}</div></div>`;}

  let html=`
  <div class="head">
    <div>
      <div class="brand">LIVES</div>
      <div class="code">Auditoría Final / Acabados · AC-009-25</div>
      <div class="code">${esc(r[C.id])}</div>
    </div>
    <div class="res">
      <div class="bigres ${cls}">${esc(resF)}</div>
      <div class="code" style="margin-top:6px">Semana ${esc(r[C.semana])} · ${esc(fechaTxt(r[C.fecha]))}</div>
    </div>
  </div>

  <h2>Datos del lote</h2>
  <div class="grid">
    ${fil('Cliente',r[C.cliente])}
    ${fil('Grupo',r[C.grupo])}
    ${fil('Proceso',r[C.proceso])}
    ${fil('Estilo LIVES',r[C.estiloL])}
    ${fil('Estilo cliente',r[C.estiloC])}
    ${fil('PO',r[C.po])}
    ${fil('Color',r[C.color])}
    ${fil('Destino',r[C.destino])}
    ${fil('Servicio / Taller',r[C.servicio])}
    ${fil('N° auditoría',r[C.nAud])}
    ${fil('Interna/Externa',r[C.intext])}
    ${fil('Auditor',r[C.auditor])}
  </div>

  <h2>Cantidades y AQL</h2>
  <div class="grid">
    ${fil('Cant. pedido',r[C.pedido])}
    ${fil('Total recibido',r[C.recibido])}
    ${fil('Lote real',r[C.lote])}
    ${fil('Licencia',r[C.licencia])}
    ${fil('Reproceso',r[C.reproceso])}
    ${fil('Nivel AQL',r[C.nivel])}
  </div>
  <div class="aqlbox">
    <div class="b"><div class="k">Muestra</div><div class="v">${esc(r[C.muestra])||'—'}</div></div>
    <div class="b"><div class="k">Acepta máx</div><div class="v">${esc(r[C.aceptaMax])||'—'}</div></div>
    <div class="b"><div class="k">Total defectos</div><div class="v">${esc(r[C.totalDef])||'0'}</div></div>
    <div class="b"><div class="k">Resultado AQL</div><div class="v" style="font-size:14px">${esc(r[C.resAql])||'—'}</div></div>
  </div>`;

  if(norm(r[C.override]).indexOf('s')===0){
    html+=`<div class="ovbox"><b>Pase al rechazo (override):</b> autorizado por ${esc(r[C.ovWho])||'—'} · Motivo: ${esc(r[C.ovWhy])||'—'}</div>`;
  }

  // Defectos
  html+=`<h2>Defectos (${defs.length})</h2>`;
  if(defs.length){
    html+=`<table><thead><tr><th>Sección</th><th>Categoría</th><th>Subtipo</th><th>Cant.</th><th>Detalle</th><th>Foto</th></tr></thead><tbody>`;
    defs.forEach(d=>{
      const tituloDef = 'Defecto: ' + (d[2]||'') + (d[3]?(' - '+d[3]):'');
      const foto = d[6] ? `<div class="deffotoWrap"><div class="deflab">${esc(tituloDef)}</div><img src="${driveImg(d[6])}" class="deffoto" onclick="abrirLb('${driveImgFull(d[6])}', '${esc(tituloDef).replace(/'/g,"\\'")}')" alt="foto defecto"></div>` : '—';
      html+=`<tr><td>${esc(d[1])}</td><td>${esc(d[2])}</td><td>${esc(d[3]||'—')}</td><td>${esc(d[4])}</td><td>${esc(d[5])}</td><td>${foto}</td></tr>`;
    });
    html+=`</tbody></table>`;
  } else { html+=`<div class="coment">Sin defectos registrados.</div>`; }

  // Derivados
  html+=`<h2>Derivados (${ders.length})</h2>`;
  if(ders.length){
    html+=`<table><thead><tr><th>Categoría</th><th>Subtipo</th><th>Cant. (lote)</th><th>Detalle</th><th>Foto</th></tr></thead><tbody>`;
    ders.forEach(d=>{
      const tituloDer = 'Derivado: ' + (d[2]||'') + (d[3]?(' - '+d[3]):'');
      const foto = d[6] ? `<div class="deffotoWrap"><div class="deflab">${esc(tituloDer)}</div><img src="${driveImg(d[6])}" class="deffoto" onclick="abrirLb('${driveImgFull(d[6])}', '${esc(tituloDer).replace(/'/g,"\\'")}')" alt="foto derivado"></div>` : '—';
      html+=`<tr><td>${esc(d[2])}</td><td>${esc(d[3]||'—')}</td><td>${esc(d[4])}</td><td>${esc(d[5])}</td><td>${foto}</td></tr>`;
    });
    html+=`</tbody></table>`;
  } else { html+=`<div class="coment">Sin derivados registrados.</div>`; }

  // Medidas
  html+=`<h2>Medidas</h2><div class="grid">
    ${fil('Muestra medidas',r[C.medMuestra])}
    ${fil('Def. medidas',r[C.medDef])}
    ${fil('Resultado',r[C.medRes])}
  </div>`;

  // Comentario
  html+=`<h2>Comentario</h2><div class="coment">${esc(r[C.coment])||'—'}</div>`;

  html+=`<div class="foot"><span>LIVES · Calidad Manufactura</span><span>Generado ${new Date().toLocaleDateString('es-PE')}</span></div>`;

  document.getElementById('page').innerHTML=html;
}

// Gira y acerca combinados sobre la foto grande directamente (sin ventana aparte). No basta con
// "rotate()" en CSS — eso solo gira lo que se VE, pero la caja que envuelve la foto se queda con el
// tamaño de ANTES de girar, por eso se veía cortada o con barra para deslizar. Aquí se recalcula el
// tamaño real de la foto (ancho/alto en píxeles) cada vez que gira o hace zoom, para que la caja se
// acomode de verdad al nuevo tamaño.
function aplicarTransformFoto(img){
  const deg=parseInt(img.getAttribute('data-deg'))||0;
  const escala=parseFloat(img.getAttribute('data-escala'))||1;
  const rotado = (deg===90||deg===270);
  const box=img.closest('.imgbox');
  if(img.naturalWidth && img.naturalHeight){
    // Espacio disponible en pantalla para la foto YA GIRADA (si está de lado, el ancho disponible
    // pasa a ser la altura de la ventana, y viceversa — por eso se intercambian aquí).
    const dispW = rotado ? window.innerHeight*0.60 : Math.min(window.innerWidth*0.9, 640);
    const dispH = rotado ? Math.min(window.innerWidth*0.9, 640) : window.innerHeight*0.60;
    // Girada: lo que hoy es el ALTO de la foto pasa a ocupar el ANCHO visual (y viceversa) — por eso
    // aquí también se comparan cruzados, si no, el cálculo queda mal y la caja se sigue quedando chica.
    const s = rotado
      ? Math.min(dispW/img.naturalHeight, dispH/img.naturalWidth) * escala
      : Math.min(dispW/img.naturalWidth, dispH/img.naturalHeight) * escala;
    const w0=img.naturalWidth*s, h0=img.naturalHeight*s; // tamaño ANTES de girar (lo que usa el layout)
    img.style.width=w0+'px'; img.style.height=h0+'px';
    // "transform:rotate()" solo cambia lo que se VE, nunca el espacio que reserva el layout — por eso
    // la CAJA que envuelve la foto también se fija a mano, con el tamaño YA GIRADO (visual). Si no se
    // hace esto, la foto se ve del tamaño correcto pero la caja se queda chica y pide hacer scroll.
    if(box){ box.style.width=(rotado?h0:w0)+'px'; box.style.height=(rotado?w0:h0)+'px'; }
  }
  img.style.transform='rotate('+deg+'deg)';
}
function girarFoto(btn){
  const fig=btn.closest('figure');
  const img=fig.querySelector('img');
  let d=parseInt(img.getAttribute('data-deg'))||0;
  d=(d+90)%360;
  img.setAttribute('data-deg', d);
  fig.setAttribute('data-deg', d); // el CSS de pantalla e impresión usa el data-deg de la figure
  aplicarTransformFoto(img);
}
function activarZoomFotos(){
  document.querySelectorAll('#fotosOverlayBody .imgbox img').forEach(img=>{
    img.style.cursor='zoom-in';
    // Tamaño inicial correcto apenas carga la foto (si ya estaba en caché, "complete" ya es true)
    if(img.complete) aplicarTransformFoto(img);
    else img.addEventListener('load', ()=>aplicarTransformFoto(img));
    img.addEventListener('dblclick', ()=>{
      const cur=parseFloat(img.getAttribute('data-escala'))||1;
      const nuevo = cur>1 ? 1 : 2.5;
      img.setAttribute('data-escala', nuevo);
      img.style.cursor = nuevo>1 ? 'zoom-out' : 'zoom-in';
      aplicarTransformFoto(img);
    });
    img.addEventListener('wheel', (e)=>{
      e.preventDefault();
      let cur=parseFloat(img.getAttribute('data-escala'))||1;
      cur += (e.deltaY<0?0.2:-0.2); cur=Math.max(1,Math.min(3,cur));
      img.setAttribute('data-escala', cur);
      img.style.cursor = cur>1 ? 'zoom-out' : 'zoom-in';
      aplicarTransformFoto(img);
    }, {passive:false});
  });
}
// Antes de imprimir: se quita el tamaño en línea (calculado en píxeles para la pantalla) para que
// mande el CSS de impresión (calculado en milímetros para la hoja) — si no, el tamaño de pantalla
// pisaría al de impresión y saldría mal. Después de imprimir, se recalcula para la pantalla otra vez.
window.addEventListener('beforeprint', ()=>{
  document.querySelectorAll('#fotosOverlayBody .imgbox').forEach(box=>{
    const img=box.querySelector('img');
    if(img) img.setAttribute('data-escala','1');
    if(img) img.style.width=img.style.height=img.style.transform='';
    box.style.width=box.style.height='';
  });
});
window.addEventListener('afterprint', ()=>{
  document.querySelectorAll('#fotosOverlayBody .imgbox img').forEach(img=>aplicarTransformFoto(img));
});

/* ===== COMPARTIR REPORTE (PDF sin fotos, por WhatsApp/menú nativo) ===== */
async function compartirReporte(){
  const btn=document.getElementById('btnShare');
  const txtOrig=btn.textContent;
  btn.textContent='Generando…'; btn.disabled=true;
  try{
    // Ocultar fotos temporalmente para que el PDF salga solo con datos
    const estilo=document.createElement('style');
    estilo.id='hideFotos';
    estilo.textContent='.fotoblock,#fotosSec,.deffotoWrap,.deffoto{display:none!important}';
    document.head.appendChild(estilo);

    const page=document.getElementById('page');
    const canvas=await html2canvas(page,{scale:2,backgroundColor:'#ffffff',useCORS:true});
    // quitar el ocultado
    const h=document.getElementById('hideFotos'); if(h) h.remove();

    const { jsPDF }=window.jspdf;
    const pdf=new jsPDF('p','mm','a4');
    const pw=210, ph=297;
    const iw=pw, ih=canvas.height*pw/canvas.width;
    let pos=0, left=ih;
    const imgData=canvas.toDataURL('image/jpeg',0.92);
    // paginar si el reporte es más alto que una hoja
    if(ih<=ph){
      pdf.addImage(imgData,'JPEG',0,0,iw,ih);
    } else {
      while(left>0){
        pdf.addImage(imgData,'JPEG',0,pos,iw,ih);
        left-=ph; pos-=ph;
        if(left>0) pdf.addPage();
      }
    }

    const nombre='Auditoria_'+(ID||'reporte')+'.pdf';
    const blob=pdf.output('blob');
    const file=new File([blob],nombre,{type:'application/pdf'});

    // Compartir por menú nativo (WhatsApp, correo, etc.)
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({ files:[file], title:'Auditoría '+ID, text:'Reporte de auditoría '+ID });
    } else {
      // Respaldo: descargar el PDF (luego lo adjuntan manual)
      pdf.save(nombre);
      alert('Se descargó el PDF. Ahora puedes adjuntarlo en WhatsApp.');
    }
  }catch(err){
    alert('No se pudo generar el PDF: '+(err.message||err));
    const h=document.getElementById('hideFotos'); if(h) h.remove();
  }finally{
    btn.textContent=txtOrig; btn.disabled=false;
  }
}

function volverAtras(){
  // Si venimos de buscar.html (mismo sitio), usar el "atrás" real del navegador (conserva los filtros de búsqueda).
  // Si se abrió el enlace directo (ej. compartido por WhatsApp), no hay a dónde volver: ir a buscar.html.
  if(document.referrer && document.referrer.indexOf(location.origin)===0){
    history.back();
  } else {
    location.href='buscar.html';
  }
}
