<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscar auditorías · LIVES</title>
<style>
:root{--navy:#1f3864;--green:#2a9d8f;--red:#e63946;--amber:#e9c46a;--ora:#f4a261;--bg:#eef2f6;--ink:#243040}
*{box-sizing:border-box}
body{margin:0;font-family:'Barlow',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.top{background:var(--navy);color:#fff;padding:16px 20px}
.top h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.3px}
.top .sub{font-size:12px;opacity:.8;margin-top:2px}
.wrap{max-width:1100px;margin:0 auto;padding:18px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#667;margin-bottom:4px}
input,select{width:100%;border:1px solid #dce1e7;border-radius:9px;padding:10px;font:inherit;background:#fbfcfd}
.btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:none;border-radius:9px;padding:11px 18px;font-weight:700;cursor:pointer;font-size:14px}
.btn.prim{background:var(--navy);color:#fff}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.toggle{background:#fff;color:var(--navy);border:1px solid #dce1e7}
.btn.toggle.active{background:var(--amber);color:#5c4400;border-color:var(--amber)}
.hint{font-size:12px;color:#889;margin-top:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.top .txt{min-width:0}
.top-link{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:9px;padding:9px 14px;font-weight:700;font-size:13px;text-decoration:none;white-space:nowrap}
.top-link:hover{background:rgba(255,255,255,.28)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--navy);color:#fff;text-align:left;padding:9px 10px;position:sticky;top:0;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
td{padding:9px 10px;border-bottom:1px solid #eef1f4}
tr:hover td{background:#f6f9fb}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.ap{background:#e3f4f1;color:#1c7a6e}.re{background:#fde7e9;color:#c32030}.ov{background:#fcf3df;color:#9a7415}
.ver{color:var(--navy);font-weight:700;text-decoration:none;border:1px solid var(--navy);padding:5px 12px;border-radius:7px;font-size:12px;white-space:nowrap}
.ver:hover{background:var(--navy);color:#fff}
.tablewrap{overflow-x:auto;max-height:62vh;overflow-y:auto}
.estado{padding:24px;text-align:center;color:#889}
.count{font-size:13px;color:#667;margin-bottom:10px}
@media(max-width:560px){th:nth-child(4),td:nth-child(4),th:nth-child(5),td:nth-child(5){display:none}}

  .fdWrap{position:fixed;inset:0;background:rgba(14,59,54,.55);display:none;
          align-items:center;justify-content:center;z-index:200;padding:20px;}
  .fdCard{background:#fff;border-radius:12px;max-width:620px;width:100%;
          max-height:88vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.3);}
  .fdHead{background:#0E3B36;color:#fff;padding:13px 18px;font-weight:700;font-size:15px;
          display:flex;justify-content:space-between;align-items:center;
          position:sticky;top:0;border-bottom:3px solid #10B981;}
  .fdHead button{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;line-height:1;}
  .fdBody{padding:16px 18px;}
  .fdAviso{background:#FFFBEB;border:1px solid #F59E0B;color:#92400E;border-radius:8px;
          padding:10px 13px;font-size:12.5px;margin-bottom:14px;line-height:1.6;}
  .fdRow{display:flex;justify-content:space-between;gap:16px;padding:7px 0;
          border-bottom:1px solid #F1F6F4;font-size:14px;}
  .fdRow span{color:#5F726C;} .fdRow b{color:#333;text-align:right;}
  .fdRow.col{flex-direction:column;} .fdRow.col b{text-align:left;margin-top:4px;line-height:1.7;}

  .tiempos{font-size:11.5px;color:#5F726C;margin:8px 0 4px;display:flex;
           align-items:center;gap:10px;flex-wrap:wrap;}
  .tiempos button{background:#0F7A5A;color:#fff;border:none;border-radius:6px;
           padding:4px 12px;font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>
<div class="top">
  <div class="txt">
    <h1>Buscar auditorías</h1>
    <div class="sub">AC-009-25 · Calidad Manufactura · LIVES</div>
  </div>
</div>

<div class="wrap">
  <div class="card">
    <div class="filtros">
      <div><label>Proceso</label><select id="fProceso"><option value="">Todos</option><option>Costura (taller)</option><option>Acabados (taller)</option><option>Acabados Final (interno)</option></select></div>
      <div><label>Grupo</label><input id="fGrupo" placeholder="EFI-102"></div>
      <div><label>Estilo LIVES</label><input id="fEstilo" placeholder="24647"></div>
      <div><label>Color</label><input id="fColor" placeholder="White"></div>
      <div><label>PO</label><input id="fPo" placeholder="6002469"></div>
      <div><label>Cliente</label><select id="fCliente"><option value="">Todos</option></select></div>
      <div><label>Auditor</label><select id="fAuditor"><option value="">Todos</option></select></div>
      <div><label>Resultado</label><select id="fResultado"><option value="">Todos</option><option value="aprob">Aprobado</option><option value="rech">Rechazado</option><option value="override">Override</option></select></div>
      <div><label>Desde</label><input id="fDesde" type="date"></div>
      <div><label>Hasta</label><input id="fHasta" type="date"></div>
    </div>
    <div class="btns">
      <button class="btn prim" id="btnBuscar">Buscar</button>
      <button class="btn sec" id="btnLimpiar">Limpiar</button>
      <button class="btn toggle" id="btnReprocesos" type="button">Reprocesos</button>
      <button class="btn toggle" id="btnLicencias" type="button">Licencias</button>
      <button class="btn toggle" id="btnEnVivo" type="button">Solo en vivo</button>
      <button class="btn toggle" id="btnDigitado" type="button">Solo digitado</button>
    </div>
    <div class="hint">Deja los campos vacíos y pulsa Buscar para ver las más recientes. Puedes combinar filtros.</div>
  </div>

  <div class="card">
    <div class="count" id="count"></div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>ID</th><th>Fecha</th><th>Cliente / Grupo</th><th>Estilo / PO</th><th>Auditor</th><th>Resultado</th><th>Origen</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="estado" id="estado">Cargando auditorías…</div>
  </div>
</div>

<script>
const SHEET_ID='1zM-ajBkOs_PgyzEaXh_gVJ1seXvjRJSVO1ZRql7KnVQ';
/* Hoja PUBLICO_FINAL del Sheet maestro: ya trae lo capturado en vivo por las
   auditoras y lo digitado por Athina, unidos y sin duplicar (cuando un lote
   está en las dos fuentes, manda el piloto). Por eso se lee una sola hoja. */
const CSV_FINAL='https://docs.google.com/spreadsheets/d/e/2PACX-1vTKWLLY0X8T7RtdteQstuEPubtGudtgTpJEa5gRClMFK2PCgDR7wFv07AIYUMJwmtxhL-xX4uEGQkp4/pub?gid=1078730994&single=true&output=csv';
let ORIGEN='';   // '', 'EN VIVO' o 'DIGITADO'
let DATA=[];
// índices de columnas en AUDITORÍAS
const C={id:0,fecha:1,nAud:2,proceso:3,intext:4,servicio:5,cliente:6,grupo:7,estiloL:8,estiloC:9,po:10,color:11,
         destino:12,pedido:13,recibido:14,lote:15,licencia:16,resAql:23,override:24,resFinal:27,auditor:31,semana:32,
         computable:38,reproceso:39,captura:50,defectos:51,derivados:52};
// Filtros toggle (Reprocesos / Licencias) — no van como columnas en la tabla, solo filtran
let filtroReproceso=false, filtroLicencia=false;
function esVerdadero(v){
  const s=norm(v);
  if(!s) return false;
  return !['0','no','false','n/a','na'].includes(s);
}

async function gviz(tab){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tab)}`;
  const r=await fetch(url); const t=await r.text();
  const j=JSON.parse(t.substring(t.indexOf('{'),t.lastIndexOf('}')+1));
  return (j.table.rows||[]).map(row=>(row.c||[]).map(c=>c&&c.v!=null?String(c.v):''));
}
function norm(s){return String(s||'').trim().toLowerCase();}
// Convierte fechas de gviz "Date(2026,5,15)" a "2026-06-15". Si ya es texto normal, lo deja.
function fechaTxt(v){
  if(v==null||v==='') return '';
  const s=String(v);
  const m=s.match(/^Date\((\d+),(\d+),(\d+)/);
  if(m){
    const a=m[1], mes=('0'+(parseInt(m[2])+1)).slice(-2), d=('0'+m[3]).slice(-2);
    return a+'-'+mes+'-'+d;
  }
  return s.substring(0,10);
}
function esEnc(r){return !r[0]||norm(r[0])==='id_auditoria'||norm(r[0])==='';}

/* CSV que respeta comillas: un defecto puede traer comas en el texto. */
function leerCSV(txt){
  if(txt.charCodeAt(0)===0xFEFF) txt=txt.slice(1);
  const filas=[]; let campo='', fila=[], dentro=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(dentro){ if(c==='"'){ if(txt[i+1]==='"'){campo+='"';i++;} else dentro=false; } else campo+=c; }
    else if(c==='"') dentro=true;
    else if(c===','){ fila.push(campo); campo=''; }
    else if(c==='\n'){ fila.push(campo); filas.push(fila); fila=[]; campo=''; }
    else if(c!=='\r') campo+=c;
  }
  if(campo!==''||fila.length){ fila.push(campo); filas.push(fila); }
  return filas;
}

/* Guarda el CSV en el navegador por 5 minutos. En planta lo abren muchas veces
   al día: la primera carga paga la descarga y las siguientes son instantáneas.
   El botón «Actualizar» fuerza traerlo de nuevo. */
const CACHE_KEY='lives_buscar_final', CACHE_MIN=5;
function leerCache(){
  try{
    const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
    if(c && (Date.now()-c.t) < CACHE_MIN*60000) return c;
  }catch(e){}
  return null;
}

async function cargar(forzar){
  const t0=performance.now();
  const est=document.getElementById('estado');
  est.style.display='block';
  try{
    let txt, deCache=false, tDesc=0;
    const c = forzar ? null : leerCache();
    if(c){ txt=c.txt; deCache=true; }
    else{
      est.textContent='Descargando auditorías…';
      const d0=performance.now();
      txt=await (await fetch(CSV_FINAL+'&_='+Date.now(),{cache:'no-store'})).text();
      tDesc=performance.now()-d0;
      try{ localStorage.setItem(CACHE_KEY, JSON.stringify({t:Date.now(), txt:txt})); }catch(e){}
    }
    est.textContent='Preparando la tabla…';
    window.__t={t0:t0, desc:tDesc, cache:deCache};
    const tabla=leerCSV(txt);
    if(tabla.length<2) throw new Error('hoja vacía');
    const cab=tabla[0].map(x=>String(x||'').trim());
    const ix={}; cab.forEach((c,k)=>{ if(c) ix[c]=k; });
    /* Se reconstruye el mismo arreglo por índice que ya usaba el buscador,
       para no tocar ni los filtros ni el pintado. */
    const rows=tabla.slice(1).filter(f=>f && f.length>2).map(f=>{
      const g=n=>(ix[n]!==undefined? String(f[ix[n]]??'').trim() : '');
      const a=[];
      a[C.id]=g('ID_AUDITORIA');      a[C.fecha]=g('FECHA');
      a[C.nAud]=g('N° DE AUDITORÍA'); a[C.proceso]=g('TIPO');
      a[C.intext]=g('INT/EXT');       a[C.servicio]=g('SERVICIO');
      a[C.cliente]=g('CLIENTE');      a[C.grupo]=g('GRUPO');
      a[C.estiloL]=g('ESTILO');       a[C.estiloC]=g('E.CLIENTE');
      a[C.po]=g('PO');                a[C.color]=g('COLOR');
      a[C.destino]=g('DESTINO');      a[C.recibido]=g('LOTE');
      a[C.lote]=g('MUESTRA');         a[C.licencia]=g('TIPO_LIC').toUpperCase()==='LICENCIA'?'1':'';
      a[C.resFinal]=g('RESULTADO');   a[C.auditor]=g('AUDITOR');
      a[C.semana]=g('SEMANA');        a[C.computable]=g('COMPUTABLE');
      a[C.reproceso]=g('REPROCESO');  a[C.captura]=g('CAPTURA')||'DIGITADO';
      a[C.defectos]=g('DEFECTOS');    a[C.derivados]=g('DERIVADOS');
      return a;
    });
    DATA=rows.filter(r=>r[C.resFinal]);
    const tProc=performance.now()-t0-(window.__t.desc||0);
    window.__t.proc=tProc;
    /* Al abrir se muestran los últimos 60 días. Cargar 4 000 filas de golpe hacía
       lenta la pantalla, y casi siempre se busca algo reciente. Con «Limpiar»
       o cambiando las fechas se ve todo el histórico. */
    if(!document.getElementById('fDesde').value){
      const d=new Date(Date.now()-60*864e5);
      document.getElementById('fDesde').value =
        d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
    }
    // poblar selects de cliente y auditor
    const tt=window.__t, total=Math.round(performance.now()-tt.t0);
    document.getElementById('tiempos').innerHTML =
      DATA.length.toLocaleString('es-PE')+' auditorías · '+
      (tt.cache ? 'desde la memoria del navegador'
                : 'descarga '+Math.round(tt.desc)+' ms')+
      ' · preparar '+Math.round(tt.proc)+' ms · total '+total+' ms'+
      ' <button id="btnRefrescar" type="button">Actualizar</button>';
    alClic('btnRefrescar', ()=>{
      try{ localStorage.removeItem(CACHE_KEY); }catch(e){}
      cargar(true);
    });
    const sCli=new Set(), sAud=new Set();
    for(let i=0;i<DATA.length;i++){
      if(DATA[i][C.cliente]) sCli.add(DATA[i][C.cliente]);
      if(DATA[i][C.auditor]) sAud.add(DATA[i][C.auditor]);
    }
    llenarSelect('fCliente',[...sCli].sort());
    llenarSelect('fAuditor',[...sAud].sort());
    buscar();
  }catch(e){
    document.getElementById('estado').textContent='No se pudo cargar. Revisa tu conexión.';
  }
}
function llenarSelect(id,vals){
  const s=document.getElementById(id);
  vals.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o);});
}
function fechaOK(fstr,desde,hasta){
  if(!desde&&!hasta) return true;
  const f=fechaTxt(fstr);
  if(!f) return false;
  if(desde&&f<desde) return false;
  if(hasta&&f>hasta) return false;
  return true;
}
function badge(res){
  const r=norm(res);
  if(r.indexOf('override')>=0) return '<span class="tag ov">OVERRIDE</span>';
  if(r.indexOf('aprob')>=0) return '<span class="tag ap">APROBADO</span>';
  if(r.indexOf('rech')>=0) return '<span class="tag re">RECHAZADO</span>';
  return res||'—';
}
function buscar(){
  const proc=val('fProceso'),po=norm(val('fPo')),gr=norm(val('fGrupo')),es=norm(val('fEstilo')),co=norm(val('fColor')),
        cli=val('fCliente'),aud=val('fAuditor'),resu=norm(val('fResultado')),desde=val('fDesde'),hasta=val('fHasta');
  let res=DATA.filter(r=>{
    if(proc&&r[C.proceso]!==proc) return false;
    if(po&&norm(r[C.po]).indexOf(po)<0) return false;
    if(gr&&norm(r[C.grupo]).indexOf(gr)<0) return false;
    if(es&&norm(r[C.estiloL]).indexOf(es)<0) return false;
    if(co&&norm(r[C.color]).indexOf(co)<0) return false;
    if(cli&&r[C.cliente]!==cli) return false;
    if(aud&&r[C.auditor]!==aud) return false;
    if(resu&&norm(r[C.resFinal]).indexOf(resu)<0) return false;
    if(!fechaOK(r[C.fecha],desde,hasta)) return false;
    if(ORIGEN&&(r[C.captura]||'').toUpperCase()!==ORIGEN) return false;
    if(filtroReproceso&&!esVerdadero(r[C.reproceso])) return false;
    if(filtroLicencia&&!esVerdadero(r[C.licencia])) return false;
    return true;
  });
  // más recientes primero
  res.sort((a,b)=>fechaTxt(b[C.fecha]).localeCompare(fechaTxt(a[C.fecha])));
  pintar(res);
}
let RES=[], PINTADAS=0;
const PAGINA=150;

function pintar(res){
  RES=res; PINTADAS=0;
  document.getElementById('tbody').innerHTML='';
  pintarMas();
}

function pintarMas(){
  const res=RES;
  const tb=document.getElementById('tbody'), est=document.getElementById('estado'), cnt=document.getElementById('count');
  if(!res.length){ est.style.display='block'; est.textContent='Sin resultados. Ajusta los filtros.';
    cnt.textContent=''; document.getElementById('masWrap').style.display='none'; return; }
  est.style.display='none';

  const hasta=Math.min(PINTADAS+PAGINA, res.length);
  const frag=document.createDocumentFragment();
  for(let i=PINTADAS;i<hasta;i++){
    const r=res[i];
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><b>${r[C.id]||''}</b></td>
      <td>${fechaTxt(r[C.fecha])}</td>
      <td>${r[C.cliente]||''}<br><span style="color:#889">${r[C.grupo]||''}</span></td>
      <td>${r[C.estiloL]||''}<br><span style="color:#889">${r[C.po]||''}</span></td>
      <td>${r[C.auditor]||''}</td>
      <td>${badge(r[C.resFinal])}</td>
      <td>${origenTag(r[C.captura])}</td>
      <td>${botonVer(r,i)}</td>`;
    frag.appendChild(tr);
  }
  tb.appendChild(frag);
  PINTADAS=hasta;

  cnt.textContent = res.length.toLocaleString('es-PE')+' auditoría(s) · mostrando '+
                    PINTADAS.toLocaleString('es-PE');
  const mw=document.getElementById('masWrap');
  mw.style.display = PINTADAS<res.length ? 'block' : 'none';
  document.getElementById('btnMas').textContent =
    'Ver '+Math.min(PAGINA,res.length-PINTADAS)+' más de '+(res.length-PINTADAS).toLocaleString('es-PE');
}

/* Un solo escuchador para toda la tabla, en vez de uno por fila. */
document.getElementById('tbody').addEventListener('click',function(e){
  const b=e.target.closest('[data-ver]');
  if(b) verDigitada(RES[+b.dataset.ver]);
});
/* Las capturadas en vivo tienen ficha completa con fotos y medidas.
   Las digitadas vienen de la hoja de papel: no hay fotos ni medidas, y por eso
   se abre un resumen en pantalla en vez de mandar a una ficha medio vacía. */
function origenTag(cap){
  return (cap||'').toUpperCase()==='EN VIVO'
    ? '<span class="tag ov">EN VIVO</span>'
    : '<span class="tag" style="background:#EEF2F7;color:#4E6B78">DIGITADO</span>';
}
function botonVer(r,i){
  if((r[C.captura]||'').toUpperCase()==='EN VIVO' && r[C.id])
    return `<a class="ver" href="ver.html?id=${encodeURIComponent(r[C.id])}">Ver / PDF</a>`;
  /* Se pasa solo el índice. Antes iba la fila entera en JSON dentro del onclick:
     con miles de filas eso hacía el HTML varias veces más pesado sin necesidad. */
  return `<button class="ver" type="button" data-ver="${i}">Ver</button>`;
}
function verDigitada(r){
  const f=document.getElementById('fichaDig');
  const li=(t,v)=>v?`<div class="fdRow"><span>${t}</span><b>${v}</b></div>`:'';
  f.querySelector('.fdBody').innerHTML=
    `<div class="fdAviso">Registro <b>digitado</b> de la hoja de papel. No tiene fotos ni
      medidas prenda por prenda: eso solo existe en las auditorías capturadas en vivo.</div>`+
    li('Fecha', fechaTxt(r[C.fecha])) + li('Cliente', r[C.cliente]) + li('Grupo', r[C.grupo]) +
    li('Estilo', r[C.estiloL]) + li('Color', r[C.color]) + li('PO', r[C.po]) +
    li('Proceso', r[C.proceso]) + li('Origen', r[C.intext]) + li('Taller', r[C.servicio]) +
    li('Destino', r[C.destino]) + li('Lote recibido', r[C.recibido]) +
    li('Muestra', r[C.lote]) + li('Auditora', r[C.auditor]) +
    li('N.º de auditoría', r[C.nAud]) + li('Semana', r[C.semana]) +
    li('Resultado', r[C.resFinal]) +
    (r[C.defectos]?`<div class="fdRow col"><span>Defectos</span><b>${r[C.defectos].split('-').join('<br>')}</b></div>`:'') +
    (r[C.derivados]?li('Derivados', r[C.derivados]):'');
  f.style.display='flex';
}

/* Asigna un clic solo si el elemento existe. Un botón que falte no debe
   tumbar la carga entera: eso dejaba la pantalla en «Cargando…» para siempre. */
function alClic(id, fn){
  const e=document.getElementById(id);
  if(e) e.onclick=fn; else console.warn('falta el elemento', id);
}
function val(id){const e=document.getElementById(id); return e?e.value.trim():'';}

function setOrigen(v){
  ORIGEN = (ORIGEN===v) ? '' : v;
  const bv=document.getElementById('btnEnVivo'), bd=document.getElementById('btnDigitado');
  if(bv) bv.classList.toggle('active', ORIGEN==='EN VIVO');
  if(bd) bd.classList.toggle('active', ORIGEN==='DIGITADO');
  buscar();
}
alClic('btnMas', pintarMas);
alClic('btnEnVivo', ()=>setOrigen('EN VIVO'));
alClic('btnDigitado', ()=>setOrigen('DIGITADO'));
alClic('btnBuscar', buscar);
alClic('btnLimpiar', ()=>{
  ['fPo','fGrupo','fEstilo','fColor','fDesde','fHasta'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fProceso').value=''; document.getElementById('fCliente').value=''; document.getElementById('fAuditor').value=''; document.getElementById('fResultado').value='';
  filtroReproceso=false; filtroLicencia=false;
  document.getElementById('btnReprocesos').classList.remove('active');
  document.getElementById('btnLicencias').classList.remove('active');
  buscar();
});
alClic('btnReprocesos', ()=>{
  filtroReproceso=!filtroReproceso;
  document.getElementById('btnReprocesos').classList.toggle('active',filtroReproceso);
  buscar();
});
alClic('btnLicencias', ()=>{
  filtroLicencia=!filtroLicencia;
  document.getElementById('btnLicencias').classList.toggle('active',filtroLicencia);
  buscar();
});
// Enter en cualquier input dispara búsqueda
['fPo','fGrupo','fEstilo','fColor'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')buscar();}));

cargar();
</script>
<div id="tiempos" class="tiempos"></div>
<div id="masWrap" style="display:none;text-align:center;margin:14px 0">
  <button id="btnMas" class="chip" type="button">Ver más</button>
</div>
<div id="fichaDig" class="fdWrap" onclick="if(event.target===this)this.style.display='none'">
  <div class="fdCard">
    <div class="fdHead">Detalle de la auditoría
      <button type="button" onclick="document.getElementById('fichaDig').style.display='none'">&times;</button></div>
    <div class="fdBody"></div>
  </div>
</div>
</body>
</html>
